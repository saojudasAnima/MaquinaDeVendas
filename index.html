<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/script.css">
    <title>Máquina de Vendas</title>
</head>

<body>
    <div class="container bottom">
        <div class="candy_machine" data-toggle="candy_machine">
            <img src="./img/candy_machine.png" alt="Máquina de Doces">
        </div>
    </div>

    <div id="menu" class="menu-container hidden">
        <h1 style="color: white;">Escolha um número</h1>
        <div class="options-list" id="options-list"></div>
        <input type="text" id="selected-number" class="numeric-input" maxlength="2" readonly>
        <div class="numeric-buttons">
            <button data-value="1" class="enter-number">1</button>
            <button data-value="2" class="enter-number">2</button>
            <button data-value="3" class="enter-number">3</button>
            <button data-value="4" class="enter-number">4</button>
            <button data-value="5" class="enter-number">5</button>
            <button data-value="6" class="enter-number">6</button>
            <button data-value="7" class="enter-number">7</button>
            <button data-value="8" class="enter-number">8</button>
            <button data-value="9" class="enter-number">9</button>
            <button data-value="C" class="enter-number">C</button>
            <button data-value="0" class="enter-number">0</button>
            <button data-toggle="payment">✔</button>
        </div>
        <button class="close-menu" data-toggle="candy_machine">Fechar</button>
    </div>

    <div id="payment" class="menu-container hidden">
        <h1 style="color: white;">Escolha a forma de pagamento</h1>
        <p id="selected-candy" style="color: white;"></p>
        <div class="payment-options">
            <button>Débito</button>
            <button>Crédito</button>
            <button>Voucher</button>
        </div>
        <button class="close-payment" data-toggle="payment">Voltar</button>
    </div>

    <script type="module" src="./script/main.js"></script>
</body>

</html>
